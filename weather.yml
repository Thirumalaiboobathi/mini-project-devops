apiVersion: apps/v1
kind: Deployment
metadata:
  name: weatherservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: weatherservice
  template:
    metadata:
      labels:
        app: weatherservice
    spec:
      containers:
        - name: weathercontainer
          image: weatherservice:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 5000



---

apiVersion: v1
kind: Service
metadata:
  name: weatherservice
spec:
  selector:
    app: weatherservice
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
