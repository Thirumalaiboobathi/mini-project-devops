apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertservice
  labels:                      
    release: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertservice
  template:
    metadata:
      labels:
        app: alertservice
        release: prometheus    
    spec:
      containers:
        - name: alertcontainer
          image: alertservice:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: alertservice
  labels:
    app: alertservice
    release: prometheus        
spec:
  selector:
    app: alertservice
  ports:
    - name: http              
      protocol: TCP
      port: 5000
      targetPort: 5000
